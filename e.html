<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8-Ball רספונסיבי</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }

        /* עיצוב הכדור - גודל גמיש לפי המסך */
        .eight-ball {
            width: 80vw;
            height: 80vw;
            max-width: 350px;
            max-height: 350px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset -20px -20px 60px rgba(255,255,255,0.1), 10px 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* החלון הפנימי */
        .window {
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, #0f3460 0%, #000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid #16213e;
            text-align: center;
            padding: 10px;
        }

        #answer-text {
            font-weight: bold;
            font-size: clamp(0.9rem, 4vw, 1.2rem); /* גודל טקסט משתנה */
            opacity: 0;
            transition: opacity 0.6s ease-in;
        }

        /* אנימציית רעידה */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(2deg); }
            40% { transform: translate(3px, 2px) rotate(-2deg); }
            60% { transform: translate(-3px, 1px) rotate(1deg); }
            80% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        .shaking {
            animation: shake 0.4s ease-in-out;
            animation-iteration-count: 2;
        }

        /* ממשק קלט רספונסיבי */
        .controls {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: none;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #e94560, #950740);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        h2 {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="eight-ball" id="ball" onclick="askMagicBall()">
        <div class="window">
            <div id="answer-text">8</div>
        </div>
    </div>

    <div class="controls">
        <h2>שאל את כדור הקסם</h2>
        <input type="text" id="user-input" value="האם אהיה מתכנת תותח?">
        <br>
        <button onclick="askMagicBall()">גלה לי!</button>
    </div>

    <script>
        function getRandomFortune() {
            const categories = [
                { color: "#2ecc71", answers: ["זה בטוח", "בהחלט כן", "בוודאות", "ללא ספק"] },
                { color: "#e74c3c", answers: ["אל תבנה על זה", "ממש לא", "הסיכויים קלושים", "לא סביר"] },
                { color: "#f1c40f", answers: ["נסה שוב", "שאל מאוחר יותר", "אולי", "לא בטוח"] }
            ];

            const category = categories[Math.floor(Math.random() * categories.length)];
            const text = category.answers[Math.floor(Math.random() * category.answers.length)];
            return { text, color: category.color };
        }

        function askMagicBall() {
            const ball = document.getElementById('ball');
            const answerDisplay = document.getElementById('answer-text');
            const inputField = document.getElementById('user-input');

            // אם השדה ריק, נשתמש בשאלה שהייתה שם או בברירת מחדל
            let question = inputField.value.trim();
            if (question === "") {
                question = "האם אהיה מתכנת תותח?";
                inputField.value = question;
            }

            // אנימציה ואיפוס
            answerDisplay.style.opacity = "0";
            ball.classList.remove('shaking');
            void ball.offsetWidth; // Force reflow
            ball.classList.add('shaking');

            setTimeout(() => {
                const fortune = getRandomFortune();
                answerDisplay.textContent = fortune.text;
                answerDisplay.style.color = fortune.color;
                answerDisplay.style.opacity = "1";
            }, 800);
        }

        // תמיכה ב-Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                askMagicBall();
            }
        });
    </script>

</body>
</html>
